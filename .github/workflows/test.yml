name: run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    name: unit-tests
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5
        with:
          version: v1.3.4

      - name: Run ZKsync OS
        id: zks
        uses: dutterbutter/zksync-server-action@db/add-log-outputs
        with:
          version: latest
            
      - name: Install Foundry-ZKsync
        uses: dutterbutter/foundry-zksync-toolchain@v1.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: yarn install

      - name: Run Tests
        run: |
          yarn ci:tests

      - name: Print Anvil log
        if: always()
        run: cat ${{ steps.zks.outputs.anvil_log_path }}

      - name: Print server log
        if: always()
        run: cat ${{ steps.zks.outputs.zksync_log_path }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zks-logs
          path: .zks/*.log
