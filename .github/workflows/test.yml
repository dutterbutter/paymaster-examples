name: run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    name: unit-tests
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start Foundry Anvil in background
        run: |
          nohup anvil --port 8012 --no-request-size-limit > anvil-foundry.log 2>&1 &
          echo "⏳ waiting for anvil to come up…"
          sleep 5

      - name: Run anvil-zksync
        uses: dutterbutter/anvil-zksync-action@db/rc-v2
        with:
          mode: run
          logFilePath: anvil_zksync.log
          target: x86_64-unknown-linux-gnu
          releaseTag: v0.6.1
          externalL1: http://localhost:8012

      - name: Install Dependencies
        run: yarn install

      - name: Run Tests
        run: |
          yarn ci:tests


      - name: Upload Anvil-zksync Log
        uses: actions/upload-artifact@v4
        with:
          name: anvil_zksync-log
          path: anvil_zksync.log